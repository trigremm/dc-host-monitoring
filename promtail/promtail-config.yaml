# promtail/promtail-config.yaml
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*.log

  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Extract container name
      - source_labels: ["__meta_docker_container_name"]
        target_label: "container"

      # Extract log stream (stdout/stderr)
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "stream"

      # Drop monitoring containers (those with 'hm-' prefix)
      - source_labels: ["__meta_docker_container_name"]
        regex: "hm-.*"
        action: drop

  - job_name: imported_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: imported_logs
          __path__: /imported_logs/*.log
